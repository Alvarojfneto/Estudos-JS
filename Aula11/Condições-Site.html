<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do Carro <input type="txtvel" name="" id="txtvel"> KM/H.
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res"></div>
    <script>
      
        function calcular () {
             var txtv = document.getElementById ('txtvel')
             var vel = Number(txtv.value) 
             var res = document.getElementById ('res') 
             res.innerHTML = `<p> Sua velocidade atual é de <strong>${vel}</strong> KM/H </p>` 
             if ( vel > 60) { // so vai executar se a velocidade for acima de 60.
                res.innerHTML += ` <P> Você está acima da velocidade permitida! <strong>MULTADO!</strong> </P>`
             }
             res.innerHTML += `<p> Dirija sempre com cinto de segurança!</p>`
            }
    </script>
</body>
</html>
