<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Detector Nacionalidade</h1>
    Em qual pais você nasceu <input type="text" name="txtnac" id="txtnac">
    <input type="button" value="Conferir Nacionalidade" onclick="verificador ()">
    <div id="nac"></div>

    <script>
        function verificador () {
            var pais = document.getElementById ('txtnac')
            var nac = document.getElementById ('nac')
            if (pais.value == 'Brasil') {
                nac.innerHTML = 'você é Brasileiro !'
            } else {
                nac.innerHTML = 'Você é Estrangeiro!'
            }
        }
    </script>
</body>
</html>
