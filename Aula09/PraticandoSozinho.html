<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando com o chat gpt</title>
    <style>
body {
        background: rgba(0, 0, 0, 0.692);   
        color: blue;
        font: normal 18pt arial;
    }
</style>
</head>

<body>
    <h1 id ="titulo">Treinando Javascript</h1>
    <p id = "cor"> Essa prática foi indicada pelo <strong> CHATGPT</strong> </p>
    <p> Essa relação professor - aluno esta sendo muito legal</p>

        var modificar = window.document.getElementById("titulo")

        var trocarCor = window.document.getElementById("cor")
        trocarCor.style.color = 'red'
        var fundo = document.querySelector('div')
        fundo.style.backgroundColor = 'purple'

    </script>

    
</body>
