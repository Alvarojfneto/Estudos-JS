<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome = window.prompt ('Informe o nome do aluno:')
        var n1 = Number(window.prompt('informe a primeira nota do aluno:'))
        var n2 = Number(window.prompt('informe a segunda nota do aluno:'))
        var n3 = Number(window.prompt('informe a terceira nota do aluno:'))
        var media = (n1 + n2 + n3) / 3
        window.alert (`A Média de ${nome} nas notas ${n1} , ${n2} e ${n3} é igual a ${media}`)
    </script>
</body>
</html>
