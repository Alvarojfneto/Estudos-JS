<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática DOM - entrada, processamento, saída e manipulacao</title>
   

    <style>
    body{
        background-color: black;
        font: normal 18pt arial;
        color: azure;
    }
</style>

</head>


<body>
    <h1>Praticando com o chatgpt</h1>
    <p id = "resultado">Informe dois Números:</p>
     <button onclick="calcular()">Informar os números</button>

    <script>
        function calcular(){
         var n1 = Number(window.prompt ("Informe um Número: "))
         var n2 = Number(window.prompt ("informe outro Número: "))
         var soma = n1 + n2
         var paragrafo = document.getElementById ("resultado")
         paragrafo.innerText ='A soma dos número é ' + soma
        paragrafo.style.color = 'black'
        var fundo = document.querySelector ('body')
        fundo.style.backgroundColor = 'white'
        fundo.style.color = 'red'
        var titulo = document.querySelector ('h1')
        titulo.innerText = 'Revisão JavaScript'
           }
   
</script>
    
</body>

</html>
