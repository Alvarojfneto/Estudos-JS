<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n1 = Number.parseInt(window.prompt ("digite um numero"))
        var n2 = Number.parseFloat(window.prompt ("digite outro numero"))
        var tot = n1 + n2
        window.alert (tot) // a soma foi arredondada, uma vez que no parseInt o numero digitado é descartado a parte decimal e no parseFloat é mantido o numero decimal. eu usei decimal nos dois para fazer o teste.
                           //INFORMEI 8.75 NO N1 E 8.5 NO N2 E O PROGRAMA ME RETORNOU 16.5
    </script>
</body>
</html>
