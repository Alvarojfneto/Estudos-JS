<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome =(window.prompt ("qual o seu nome?"))
        window.alert (`Olá ${nome}, seu nome em maiusculas é escrito como ${nome.toUpperCase()} \n Olá ${nome}, seu nome em minusculas é escrito como ${nome.toLowerCase()}`)// o uso do \n é pra quebrar a linha.
        

    </script>
</body>
</html>
