<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n1 = Number(window.prompt ('escolha um numero:')) // o prompt só retorna string, por isso usar Number() na frente, ja sai convertido.
        var n2 = Number(window.prompt('escolha outro numero:'))
        var soma = n1 + n2
        window.alert (`A soma entre ${n1} e ${n2} é igual a ${soma}`)

    </script>
</body>
</html>
